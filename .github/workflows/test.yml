name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan-prompt:
    name: Hook script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the Infisical CLI and jq
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update
          sudo apt-get install -y infisical jq

      - name: Show versions
        run: |
          infisical --version
          jq --version
          bash --version | head -1

      - name: Run the hook script tests
        run: tests/test-scan-prompt.sh

  build-skills-plugin:
    name: Skills plugin build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test the build script
        run: tests/test-build-skills-plugin.sh

      - name: Build the plugin from ai-skills main
        run: scripts/build-skills-plugin.sh
