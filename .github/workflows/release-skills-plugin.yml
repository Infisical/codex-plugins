name: Release skills plugin

# Builds the infisical-skills plugin ZIP from Infisical/ai-skills.
#
# - Publish a release in GitHub (Releases > Draft a new release) with a tag v<version>, such as v1.2.0.
#   The workflow builds the plugin with the tag's version, from ai-skills main, and attaches
#   infisical-skills-<version>.zip to the release. It adds the ai-skills commit the skills came from to the release
#   notes.
# - Run it by hand (Actions > Release skills plugin > Run workflow) to build the ZIP from any ai-skills ref and download
#   it from the run's artifacts, without releasing anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ai_skills_ref:
        description: Branch, tag, or commit of Infisical/ai-skills to take the skills from
        default: main
        required: true
      version:
        description: Plugin version, such as v1.2.0 (default, the version in infisical-skills/.codex-plugin/plugin.json)
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}
      source_commit: ${{ steps.build.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the build script
        run: tests/test-build-skills-plugin.sh

      - name: Build the plugin
        id: build
        env:
          AI_SKILLS_REF: ${{ inputs.ai_skills_ref || 'main' }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: scripts/build-skills-plugin.sh --ref "$AI_SKILLS_REF" ${VERSION:+--version "$VERSION"}

      - uses: actions/upload-artifact@v4
        with:
          name: infisical-skills-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: infisical-skills-${{ needs.build.outputs.version }}

      - name: Upload the ZIP and record its source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          zip="infisical-skills-$VERSION.zip"
          gh release upload "$TAG" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          # Add the build details to the notes, once: a rerun replaces them instead of adding them again.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body |
            sed '/^<!-- infisical-skills build -->/,$d' >notes.md
          {
            echo
            echo "<!-- infisical-skills build -->"
            echo "**infisical-skills $VERSION**: skills from https://github.com/Infisical/ai-skills/tree/$SOURCE_COMMIT"
            echo
            echo "SHA-256 of \`$zip\`: \`$(sha256sum "$zip" | cut -d ' ' -f 1)\`"
          } >>notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
